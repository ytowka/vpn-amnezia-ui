name: amnezia-ui
services:
  console:
    build: .
    image: amnezia-ui:local
    restart: unless-stopped
    init: true
    ports:
      - "${UI_BIND:-0.0.0.0}:${UI_PORT:-80}:8443"
    environment:
      AWG_CONTAINER: ${AWG_CONTAINER:-amnezia-awg2}
      AWG_INTERFACE: ${AWG_INTERFACE:-awg0}
      SERVER_CONF: ${SERVER_CONF:-/opt/amnezia/awg/awg0.conf}
      CLIENTS_TABLE: ${CLIENTS_TABLE:-/opt/amnezia/awg/clientsTable}
      VPN_ENDPOINT: ${VPN_ENDPOINT:-178.236.242.31:4956}
      TLS_SAN: ${TLS_SAN:-DNS:localhost,IP:127.0.0.1}
      HOST_FORWARDING_FILE: /host/ip_forward
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/lock:/run/lock
      - /proc/sys/net/ipv4/ip_forward:/host/ip_forward:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, python3, -c, "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/', context=ssl._create_unverified_context(), timeout=4).close()"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
